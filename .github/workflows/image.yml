name: image

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions: {}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/seilent/microos
  PKG_KERNEL: ghcr.io/seilent/microos/pkg/kernel
  PUBKEY: system_files/usr/share/microos/keys/microos.pub
  BIB: quay.io/centos-bootc/bootc-image-builder@sha256:2b52843ea2bfda73b0a08d97e76b734393b1d3a804681b9fabb26723bd3a2f0b
  SOURCE_TYPE: application/vnd.microos.source.v1
  FEDORA: registry.fedoraproject.org/fedora:44@sha256:1ff9eb02e4e2d7fb1175becac7139b2960c4fdcccedce81c86ec25b98ef3124d

jobs:
  packages:
    permissions:
      actions: read
      contents: read
      packages: write
    uses: ./.github/workflows/packages.yml
    secrets:
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

  image:
    needs: packages
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      push_tag: ${{ steps.version.outputs.push_tag }}
      final_tag: ${{ steps.version.outputs.final_tag }}
      short: ${{ steps.version.outputs.short }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman skopeo

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.3

      - name: Kernel
        id: kernel
        run: |
          hash=$(build/pkg-hash.sh kernel)
          digest=sha256:$(skopeo inspect --no-creds --raw "docker://$PKG_KERNEL:$hash" | sha256sum | cut -d' ' -f1)
          cosign verify --key "$PUBKEY" "$PKG_KERNEL@$digest" > /dev/null
          echo "ref=$PKG_KERNEL@$digest" >> "$GITHUB_OUTPUT"
          echo "$PKG_KERNEL:$hash $digest"

      - name: Packages
        run: |
          mkdir -p "$RUNNER_TEMP/pkgs" "$RUNNER_TEMP/srpms/pkgs" "$RUNNER_TEMP/oci"
          for name in $(git ls-files -- 'packages/*/build.sh' | cut -d/ -f2); do
            [[ $name != kernel ]] || continue
            hash=$(build/pkg-hash.sh "$name")
            repo=$IMAGE/pkg/$name
            digest=sha256:$(skopeo inspect --no-creds --raw "docker://$repo:$hash" | sha256sum | cut -d' ' -f1)
            cosign verify --key "$PUBKEY" "$repo@$digest" > /dev/null
            oci=$RUNNER_TEMP/oci/$name
            tree=$RUNNER_TEMP/tree/$name
            skopeo copy --quiet --src-no-creds "docker://$repo@$digest" "oci:$oci"
            manifest=$(jq -r '.manifests[0].digest' "$oci/index.json")
            mapfile -t layers < <(jq -r '.layers[].digest' "$oci/blobs/sha256/${manifest#sha256:}")
            [[ ${#layers[@]} == 1 && ${layers[0]} =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::$repo@$digest has ${#layers[@]} layers"; exit 1; }
            blob=$oci/blobs/sha256/${layers[0]#sha256:}
            bad=$(tar -tvf "$blob" | awk '$1 !~ /^[-d]/ { print; next } { p = $NF; sub(/^\.\//, "", p) } p != "rpms/" && p !~ /^rpms\/[^\/]+$/ { print }')
            [[ -z $bad ]] || { echo "::error::$repo@$digest has entries other than files in rpms/: $bad"; exit 1; }
            mkdir -p "$tree"
            tar -xf "$blob" -C "$tree" --no-same-owner --no-same-permissions
            [[ -d $tree/rpms ]] || { echo "::error::$repo@$digest has no /rpms"; exit 1; }
            mv "$tree/rpms" "$RUNNER_TEMP/pkgs/$name"
            mkdir -p "$RUNNER_TEMP/srpms/pkgs/$name"
            find "$RUNNER_TEMP/pkgs/$name" -maxdepth 1 -name '*.src.rpm' -exec cp -t "$RUNNER_TEMP/srpms/pkgs/$name" {} +
            echo "$name $repo@$digest" >> "$RUNNER_TEMP/srpms/pkgs/refs"
            echo "$repo:$hash $digest"
          done
          rm -rf "$RUNNER_TEMP/oci" "$RUNNER_TEMP/tree"

      - name: Seed
        id: seed
        run: |
          rpms=("$RUNNER_TEMP"/pkgs/steam-bootstrap/microos-steam-seed-*.aarch64.rpm)
          [[ ${#rpms[@]} == 1 && -f ${rpms[0]} ]] || { echo "::error::expected one microos-steam-seed RPM, got ${rpms[*]}"; exit 1; }
          sha=$(sha256sum < "${rpms[0]}" | cut -d' ' -f1)
          mkdir -p "$RUNNER_TEMP/seed"
          podman run --rm --network=none -v "$RUNNER_TEMP/pkgs/steam-bootstrap:/rpms:ro" -v "$RUNNER_TEMP/seed:/seed" "$FEDORA" sh -c '
            set -eu
            cd /seed
            rpm2archive -n - < "/rpms/$1" | tar -x --no-same-owner
            t=$(rpm -qp --qf "%{BUILDTIME}" "/rpms/$1")
            find . -type d -exec chmod 755 {} + -exec touch -d "@$t" {} +' sh "${rpms[0]##*/}"
          want=$(printf '%s\n' 'usr d' 'usr/share d' 'usr/share/licenses d' 'usr/share/licenses/microos-steam-seed d' \
            'usr/share/licenses/microos-steam-seed/steam_subscriber_agreement.txt f' 'usr/share/microos-seed d' \
            'usr/share/microos-seed/steam-seed.tar.zst f' 'usr/share/microos-seed/steam-seed.version f')
          got=$(cd "$RUNNER_TEMP/seed" && find . -mindepth 1 -printf '%P %y\n' | LC_ALL=C sort)
          [[ $got == "$want" ]] || { echo "::error::seed RPM payload is not the allowed file list: $got"; exit 1; }
          echo "rpm_sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "${rpms[0]##*/} $sha"
          find "$RUNNER_TEMP/seed" -printf '%M %TY-%Tm-%Td %TT %s %P\n'

      - name: Version
        id: version
        run: |
          short=${GITHUB_SHA::7}
          if [[ $GITHUB_REF == refs/heads/main ]]; then
            push_tag=testing-$short
            final_tag=testing
            channel=true
          else
            push_tag=dev-$short
            final_tag=dev-$short
            channel=false
          fi
          {
            echo "short=$short"
            echo "push_tag=$push_tag"
            echo "final_tag=$final_tag"
            echo "channel=$channel"
            echo "version=$(date -u +%Y%m%d).$short"
          } >> "$GITHUB_OUTPUT"
          echo "$push_tag $final_tag"

      - name: Build
        id: build
        env:
          KERNEL_REF: ${{ steps.kernel.outputs.ref }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.push_tag }}
          SEED: ${{ steps.seed.outputs.rpm_sha256 }}
        run: |
          podman build \
            --build-arg "KERNEL_REF=$KERNEL_REF" \
            --build-arg "MICROOS_VERSION=$VERSION" \
            --build-arg "MICROOS_SEED=$SEED" \
            --build-context "pkgs=$RUNNER_TEMP/pkgs" \
            --build-context "seed=$RUNNER_TEMP/seed" \
            -t "$IMAGE:$TAG" .
          base=$(sed -n 's/^FROM \([^ ]*\/fedora-bootc:[^ ]*\)$/\1/p' Containerfile)
          [[ -n $base ]] || { echo "::error::no fedora-bootc FROM line in Containerfile"; exit 1; }
          mapfile -t want < <(podman image inspect --format '{{range .RootFS.Layers}}{{println .}}{{end}}' "$base" | sed '/^$/d')
          mapfile -t got < <(podman image inspect --format '{{range .RootFS.Layers}}{{println .}}{{end}}' "$IMAGE:$TAG" | sed '/^$/d')
          n=${#want[@]}
          [[ $n -gt 0 && ${got[*]:0:n} == "${want[*]}" ]] || { echo "::error::image layers do not start with the $base layers"; exit 1; }
          echo "seed_index=$n" >> "$GITHUB_OUTPUT"
          echo "::notice::seed layer diff id ${got[n]}"
          if cfg=$(skopeo inspect --no-creds --config "docker://$IMAGE:testing" 2> "$RUNNER_TEMP/err"); then
            old=$(jq -r '.config.Labels["microos.seed"] // empty' <<< "$cfg")
            if [[ $old == "$SEED" ]]; then
              jq -e --arg d "${got[n]}" '.rootfs.diff_ids | index($d)' <<< "$cfg" > /dev/null \
                || { echo "::error::seed RPM $SEED is the one in $IMAGE:testing, but seed layer ${got[n]} is not in it"; exit 1; }
              echo "same_seed=true" >> "$GITHUB_OUTPUT"
              echo "seed layer diff id matches $IMAGE:testing"
            else
              echo "::notice::seed RPM differs from $IMAGE:testing (${old:-none}), no layer comparison"
            fi
          elif grep -qiE 'manifest unknown|404' "$RUNNER_TEMP/err"; then
            echo "::notice::no $IMAGE:testing, no layer comparison"
          else
            echo "::error::$(cat "$RUNNER_TEMP/err")"
            exit 1
          fi
          podman image inspect --format '{{.Size}}' "$IMAGE:$TAG" | awk '{ printf "image %.2f GB\n", $1 / 1e9 }'

      - name: InputPlumber config
        run: |
          podman run --rm -v "$PWD:/repo:ro" -v "$RUNNER_TEMP/pkgs/inputplumber:/rpms:ro" \
            registry.fedoraproject.org/fedora:44@sha256:1ff9eb02e4e2d7fb1175becac7139b2960c4fdcccedce81c86ec25b98ef3124d \
            sh -c 'dnf -yq --setopt=install_weak_deps=False install cpio python3-jsonschema python3-pyyaml && /repo/tests/inputplumber-config.sh /rpms'

      - name: steamos-manager config
        run: |
          podman run --rm -v "$PWD:/repo:ro" "$FEDORA" \
            sh -c 'dnf -yq --setopt=install_weak_deps=False install python3 && /repo/tests/steamos-manager-config.sh'

      - name: Test
        env:
          TAG: ${{ steps.version.outputs.push_tag }}
        run: |
          git fetch --no-tags --depth=1 origin main
          PKG_HASH_BASE=FETCH_HEAD tests/pkg-hash.sh
          podman run --rm -v "$PWD:/repo:ro" "$FEDORA" \
            sh -c 'dnf -yq --setopt=install_weak_deps=False install python3-gobject python3-evdev dbus-daemon util-linux systemd-udev && /repo/tests/powerd.sh && /repo/tests/hotkeyd.sh && /repo/tests/sleep.sh && /repo/tests/steamos-manager-policy.sh'
          podman run --rm -v "$PWD/tests:/tests:ro" -v "$RUNNER_TEMP/pkgs/steam-bootstrap:/seed-rpm:ro" "$IMAGE:$TAG" /tests/image.sh
          podman run --rm -e MICROOS_TREE=/ -v "$PWD/tests:/tests:ro" "$IMAGE:$TAG" /tests/helpers.sh
          podman run --rm -e MICROOS_TREE=/ -v "$PWD/tests:/tests:ro" "$IMAGE:$TAG" /tests/storage.sh
          podman run --rm -e MICROOS_TREE=/ -v "$PWD/tests:/tests:ro" "$IMAGE:$TAG" /tests/bootimg.sh
          podman run --rm -e MICROOS_TREE=/ -v "$PWD/tests:/tests:ro" "$IMAGE:$TAG" /tests/bootok.sh
          podman run --rm -e MICROOS_TREE=/ -v "$PWD/tests:/tests:ro" "$IMAGE:$TAG" /tests/update.sh
          podman run --rm -e MICROOS_TREE=/ -v "$PWD/tests:/tests:ro" "$IMAGE:$TAG" /tests/audio.sh
          podman run --rm -e MICROOS_TREE=/ -v "$PWD/tests:/tests:ro" "$IMAGE:$TAG" /tests/session.sh
          podman run --rm -e MICROOS_TREE=/ -v "$PWD/tests:/tests:ro" "$IMAGE:$TAG" /tests/microos-session.sh
          podman run --rm -e MICROOS_TREE=/ -v "$PWD/tests:/tests:ro" "$IMAGE:$TAG" /tests/steam-launcher.sh
          podman run --rm -e MICROOS_TREE=/ -v "$PWD/tests:/tests:ro" "$IMAGE:$TAG" /tests/steam-seed.sh
          podman run --rm -v "$PWD/tests:/tests:ro" "$IMAGE:$TAG" /tests/steam-libs.sh

      - name: Source RPMs
        env:
          TAG: ${{ steps.version.outputs.push_tag }}
        run: |
          podman run --rm "$IMAGE:$TAG" rpm -qa --qf '%{NAME}\t%{SOURCERPM}\t%{VENDOR}\n' > "$RUNNER_TEMP/srpms/srpms.tsv"
          wc -l < "$RUNNER_TEMP/srpms/srpms.tsv"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: srpms-${{ steps.version.outputs.short }}
          path: ${{ runner.temp }}/srpms
          if-no-files-found: error
          retention-days: 1

      - name: Push
        id: push
        env:
          TAG: ${{ steps.version.outputs.push_tag }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          podman login ghcr.io -u "$GH_ACTOR" --password-stdin <<< "$GH_TOKEN"
          podman push --digestfile "$RUNNER_TEMP/digest" "$IMAGE:$TAG"
          digest=$(cat "$RUNNER_TEMP/digest")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$IMAGE:$TAG $digest"

      - name: Seed layer
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          N: ${{ steps.build.outputs.seed_index }}
          SAME: ${{ steps.build.outputs.same_seed }}
        run: |
          layer=$(skopeo inspect --no-creds --raw "docker://$IMAGE@$DIGEST" | jq -r --argjson n "$N" '.layers[$n] | "\(.digest) \(.size)"')
          [[ $layer =~ ^sha256:[0-9a-f]{64}\ [0-9]+$ ]] || { echo "::error::no seed layer at $N: $layer"; exit 1; }
          echo "::notice::seed layer $layer"
          if [[ $SAME == true ]]; then
            if skopeo inspect --no-creds --raw "docker://$IMAGE:testing" | jq -e --arg d "${layer%% *}" '[.layers[].digest] | index($d)' > /dev/null; then
              echo "seed layer blob matches $IMAGE:testing"
            else
              echo "::warning::seed layer diff id matches $IMAGE:testing but blob ${layer%% *} is not in it; updates download the seed again"
            fi
          fi

      - name: Unsigned check
        env:
          TAG: ${{ steps.version.outputs.push_tag }}
        run: |
          podman run --rm -v "$PWD/tests:/tests:ro" "$IMAGE:$TAG" /tests/verify-sig.sh unsigned "docker://$IMAGE:$TAG"

      - name: Sign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          cosign login ghcr.io -u "$GH_ACTOR" --password-stdin <<< "$GH_TOKEN"
          cosign sign --yes --new-bundle-format=false --key env://COSIGN_PRIVATE_KEY "$IMAGE@$DIGEST"

      - name: Verify
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign verify --key "$PUBKEY" "$IMAGE@$DIGEST" > /dev/null

      - name: Signed check
        env:
          TAG: ${{ steps.version.outputs.push_tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          podman run --rm -v "$PWD/tests:/tests:ro" "$IMAGE:$TAG" \
            /tests/verify-sig.sh signed "docker://$IMAGE@$DIGEST" dir:/var/tmp/signed

  source:
    needs: image
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      DIGEST: ${{ needs.image.outputs.digest }}
      SHORT: ${{ needs.image.outputs.short }}
      MODE: ${{ needs.image.outputs.channel == 'true' && 'full' || 'base' }}
      ORAS_VERSION: 1.3.4
      ORAS_SHA256: 15702c6e3a4a56a8bd8ac5c17efdbcab56d9bada661ccbcf017f5b10c1d89399
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          tarball=oras_${ORAS_VERSION}_linux_arm64.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/$tarball" "https://github.com/oras-project/oras/releases/download/v$ORAS_VERSION/$tarball"
          echo "$ORAS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/bin" oras
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.3

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: srpms-${{ needs.image.outputs.short }}
          path: ${{ runner.temp }}/srpms

      - name: Source cache
        if: env.MODE == 'full'
        run: |
          start=$SECONDS
          cache=$RUNNER_TEMP/cache
          mkdir -p "$cache"
          awk -F'\t' '$3 != "MicroOS" && $2 != "(none)" { print $2 }' "$RUNNER_TEMP/srpms/srpms.tsv" | sort -u > "$RUNNER_TEMP/need"
          if ! refs=$(oras discover --artifact-type "$SOURCE_TYPE" --format json --depth 1 "$IMAGE:testing" | jq -r '.referrers[]?.digest'); then
            echo "::notice::no source artifact on $IMAGE:testing, every source rpm comes from koji"
            exit 0
          fi
          for d in $refs; do
            layer=$(oras manifest fetch "$IMAGE@$d" | jq -r '.layers[] | select(.annotations["org.opencontainers.image.title"] == "SOURCES") | .digest')
            [[ $layer == sha256:* && $layer != *$'\n'* ]] || continue
            oras blob fetch --output "$RUNNER_TEMP/prev.SOURCES" "$IMAGE@$layer"
            break
          done
          [[ -s $RUNNER_TEMP/prev.SOURCES ]] || { echo "::notice::no SOURCES on $IMAGE:testing"; exit 0; }
          while read -r f sum; do
            (( $(jobs -rp | wc -l) < 8 )) || wait -n
            { oras blob fetch --output "$cache/$f" "$IMAGE@sha256:$sum" > /dev/null 2>&1 || rm -f "$cache/$f"; } &
          done < <(awk 'NR == FNR { need[$1] = 1; next } ($1 in need) && $2 ~ /^[0-9a-f]{64}$/ { print $1, $2 }' \
            "$RUNNER_TEMP/need" "$RUNNER_TEMP/prev.SOURCES")
          wait
          echo "::notice::$(find "$cache" -name '*.src.rpm' | wc -l) of $(wc -l < "$RUNNER_TEMP/need") source rpms from $IMAGE:testing in $((SECONDS - start)) s"

      - name: Sources
        env:
          MICROOS_SOURCE_CACHE: ${{ env.MODE == 'full' && format('{0}/cache', runner.temp) || '' }}
        run: |
          start=$SECONDS
          build/source-artifact.sh "$RUNNER_TEMP/srpms/srpms.tsv" "$RUNNER_TEMP/source" "$MODE" "$RUNNER_TEMP/srpms/pkgs"
          echo "$((SECONDS - start)) s"

      - name: Attach
        id: attach
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          oras login ghcr.io -u "$GH_ACTOR" --password-stdin <<< "$GH_TOKEN"
          cd "$RUNNER_TEMP/source"
          want=$(awk '{ print $1 " sha256:" $2 }' SOURCES | sort)
          refs=$(oras discover --artifact-type "$SOURCE_TYPE" --format json --depth 1 "$IMAGE@$DIGEST" \
            | jq -r 'if (.referrers | type) == "array" then .referrers[].digest else error("no referrers list") end')
          art=
          for d in $refs; do
            oras manifest fetch "$IMAGE@$d" > "$RUNNER_TEMP/ref.json"
            got=$(jq -r '.layers[] | select(.annotations["org.opencontainers.image.title"] != "SOURCES")
              | "\(.annotations["org.opencontainers.image.title"]) \(.digest)"' "$RUNNER_TEMP/ref.json" | sort)
            [[ $got == "$want" ]] || continue
            layer=$(jq -r '.layers[] | select(.annotations["org.opencontainers.image.title"] == "SOURCES") | .digest' "$RUNNER_TEMP/ref.json")
            if [[ -n $layer && $layer != *$'\n'* ]] && oras blob fetch --output - "$IMAGE@$layer" | cmp -s - SOURCES; then
              art=$d
              echo "reusing $IMAGE@$art"
              break
            fi
          done
          if [[ -z $art ]]; then
            start=$SECONDS
            mapfile -t files < <(cut -d' ' -f1 SOURCES)
            art=$(oras attach --artifact-type "$SOURCE_TYPE" --format go-template --template '{{.digest}}' \
              "$IMAGE@$DIGEST" "${files[@]}" SOURCES)
            echo "attached $IMAGE@$art in $((SECONDS - start)) s"
          fi
          [[ $art == sha256:* ]] || { echo "::error::no artifact digest: $art"; exit 1; }
          echo "digest=$art" >> "$GITHUB_OUTPUT"

      - name: Sign source
        env:
          ART: ${{ steps.attach.outputs.digest }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          cosign login ghcr.io -u "$GH_ACTOR" --password-stdin <<< "$GH_TOKEN"
          cosign sign --yes --new-bundle-format=false --key env://COSIGN_PRIVATE_KEY "$IMAGE@$ART"

      - name: Check source
        env:
          ART: ${{ steps.attach.outputs.digest }}
        run: |
          cosign verify --key "$PUBKEY" "$IMAGE@$ART" > /dev/null
          . packages/kernel/SOURCE.env
          names=$(printf '%s\n' "microos-$SHORT.tar.gz" "linux-$KERNEL_VERSION.tar.xz")
          if [[ $MODE == full ]]; then
            names+=$'\n'$(awk -F'\t' '$2 != "(none)" && ($3 != "MicroOS" || ($1 != "microos-kernel" && $1 != "microos-steam-seed")) { print $2 }' \
              "$RUNNER_TEMP/srpms/srpms.tsv" | sort -u)
          fi
          cd "$RUNNER_TEMP/source"
          [[ $(cut -d' ' -f1 SOURCES | sort) == "$(sort <<< "$names")" ]] || { echo "::error::SOURCES is not the $MODE set"; exit 1; }
          refs=$(oras discover --artifact-type "$SOURCE_TYPE" --format json --depth 1 "$IMAGE@$DIGEST" \
            | jq -r 'if (.referrers | type) == "array" then .referrers[].digest else error("no referrers list") end')
          grep -qxF "$ART" <<< "$refs" || { echo "::error::$IMAGE@$ART is not a referrer of $DIGEST"; exit 1; }
          oras manifest fetch "$IMAGE@$ART" > "$RUNNER_TEMP/source.json"
          got=$(jq -r '.layers[] | select(.annotations["org.opencontainers.image.title"] != "SOURCES")
            | "\(.annotations["org.opencontainers.image.title"]) \(.digest)"' "$RUNNER_TEMP/source.json" | sort)
          [[ $got == "$(awk '{ print $1 " sha256:" $2 }' SOURCES | sort)" ]] || { echo "::error::layers differ from SOURCES"; exit 1; }
          layer=$(jq -r '.layers[] | select(.annotations["org.opencontainers.image.title"] == "SOURCES") | .digest' "$RUNNER_TEMP/source.json")
          [[ $layer == sha256:* && $layer != *$'\n'* ]] || { echo "::error::no single SOURCES layer"; exit 1; }
          oras blob fetch --output - "$IMAGE@$layer" | cmp -s - SOURCES || { echo "::error::attached SOURCES differs"; exit 1; }
          echo "$IMAGE@$ART: $MODE, $(wc -l < SOURCES) files, $(echo "$refs" | wc -l) source artifacts on $DIGEST"

  publish:
    needs: [image, source]
    if: needs.image.outputs.channel == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      DIGEST: ${{ needs.image.outputs.digest }}
      TAG: ${{ needs.image.outputs.final_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.3

      - name: Publish
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          head=$(git ls-remote --exit-code "https://github.com/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)
          if [[ $head != "$GITHUB_SHA" ]]; then
            echo "::notice::main is at $head, not $GITHUB_SHA; $IMAGE:$TAG stays"
            exit 0
          fi
          label() { skopeo inspect --no-creds --format '{{index .Labels "org.opencontainers.image.version"}}' "$1"; }
          new=$(label "docker://$IMAGE@$DIGEST")
          [[ $new =~ ^[0-9]{8}\.[0-9a-f]{7}$ ]] || { echo "::error::$IMAGE@$DIGEST version '$new'"; exit 1; }
          if err=$(skopeo inspect --no-creds --raw "docker://$IMAGE:$TAG" 2>&1 > /dev/null); then
            old=$(label "docker://$IMAGE:$TAG")
            [[ $old =~ ^[0-9]{8}\.[0-9a-f]{7}$ ]] || { echo "::error::$IMAGE:$TAG version '$old'"; exit 1; }
            if (( 10#${new%%.*} < 10#${old%%.*} )); then
              echo "::error::$new is older than $IMAGE:$TAG $old"
              exit 1
            fi
          elif ! grep -qiE 'manifest unknown|404' <<< "$err"; then
            echo "::error::$err"
            exit 1
          fi
          cosign verify --key "$PUBKEY" "$IMAGE@$DIGEST" > /dev/null
          skopeo login ghcr.io -u "$GH_ACTOR" --password-stdin <<< "$GH_TOKEN"
          skopeo copy --preserve-digests --remove-signatures "docker://$IMAGE@$DIGEST" "docker://$IMAGE:$TAG"
          got=sha256:$(skopeo inspect --raw "docker://$IMAGE:$TAG" | sha256sum | cut -d' ' -f1)
          [[ $got == "$DIGEST" ]] || { echo "::error::$IMAGE:$TAG resolves to $got, not $DIGEST"; exit 1; }
          echo "$IMAGE:$TAG $DIGEST"

  disk:
    needs: image
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    env:
      DIGEST: ${{ needs.image.outputs.digest }}
      TAG: ${{ needs.image.outputs.final_tag }}
      PUSH_TAG: ${{ needs.image.outputs.push_tag }}
    steps:
      - uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman skopeo pigz dosfstools btrfs-progs

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.3

      - name: Pull
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cosign verify --key "$PUBKEY" "$IMAGE@$DIGEST" > /dev/null
          sudo podman login ghcr.io -u "$GH_ACTOR" --password-stdin <<< "$GH_TOKEN"
          sudo podman pull "$IMAGE@$DIGEST"
          sudo podman tag "$IMAGE@$DIGEST" "$IMAGE:$TAG"
          sudo podman pull "$BIB"

      - name: Disk
        run: |
          mkdir -p "$RUNNER_TEMP/bib"
          sudo podman run --rm --pull=never --privileged \
            --security-opt apparmor=unconfined \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$PWD/build/disk.toml:/config.toml:ro" \
            -v "$RUNNER_TEMP/bib:/output" \
            "$BIB" --type raw --rootfs btrfs --target-arch arm64 "$IMAGE:$TAG"
          mapfile -t raws < <(sudo find "$RUNNER_TEMP/bib" -name '*.raw')
          [[ ${#raws[@]} == 1 ]] || { echo "::error::expected one raw image, got ${raws[*]}"; exit 1; }
          echo "RAW=${raws[0]}" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP/microos-$PUSH_TAG.img.gz" >> "$GITHUB_ENV"

      - name: Finalize
        run: sudo build/finalize-disk.sh "$RAW" "$IMAGE:$TAG"

      - name: Test
        run: sudo tests/disk.sh "$RAW" "$IMAGE:$TAG"

      - name: Root size
        run: |
          dev=$(sudo losetup -f -P -r --show "$RAW")
          mnt=$(mktemp -d)
          trap 'sudo umount "$mnt" 2>/dev/null || true; sudo losetup -d "$dev"' EXIT
          sudo mount -o ro "${dev}p3" "$mnt"
          read -r size used avail < <(df -B1M --output=size,used,avail "$mnt" | tail -n1)
          echo "::notice::root ${size} MiB, used ${used} MiB, free ${avail} MiB"
          (( avail >= 2048 )) || { echo "::error::root has ${avail} MiB free, under 2 GiB; raise minsize in build/disk.toml"; exit 1; }

      - name: Compress
        run: |
          sudo chown "$(id -u):$(id -g)" "$RAW"
          pigz -c -p "$(nproc)" "$RAW" > "$OUT.part"
          mv -f "$OUT.part" "$OUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: microos-${{ needs.image.outputs.push_tag }}.img.gz
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
