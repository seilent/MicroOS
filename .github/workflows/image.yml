name: image

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/seilent/microos
  PKG_KERNEL: ghcr.io/seilent/microos/pkg/kernel
  PUBKEY: system_files/usr/share/microos/keys/microos.pub
  BIB: quay.io/centos-bootc/bootc-image-builder@sha256:2b52843ea2bfda73b0a08d97e76b734393b1d3a804681b9fabb26723bd3a2f0b

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman skopeo

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.3

      - name: Kernel
        id: kernel
        run: |
          hash=$(build/pkg-hash.sh kernel)
          digest=sha256:$(skopeo inspect --no-creds --raw "docker://$PKG_KERNEL:$hash" | sha256sum | cut -d' ' -f1)
          cosign verify --key "$PUBKEY" "$PKG_KERNEL@$digest" > /dev/null
          echo "ref=$PKG_KERNEL@$digest" >> "$GITHUB_OUTPUT"
          echo "$PKG_KERNEL:$hash $digest"

      - name: Version
        id: version
        run: |
          short=${GITHUB_SHA::7}
          echo "tag=dev-$short" >> "$GITHUB_OUTPUT"
          echo "version=$(date -u +%Y%m%d).$short" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          KERNEL_REF: ${{ steps.kernel.outputs.ref }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          podman build \
            --build-arg "KERNEL_REF=$KERNEL_REF" \
            --build-arg "MICROOS_VERSION=$VERSION" \
            -t "$IMAGE:$TAG" .

      - name: Test
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          podman run --rm -v "$PWD/tests:/tests:ro" "$IMAGE:$TAG" /tests/image.sh
          podman run --rm -e MICROOS_TREE=/ -v "$PWD/tests:/tests:ro" "$IMAGE:$TAG" /tests/bootimg.sh

      - name: Push
        id: push
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          podman login ghcr.io -u "$GH_ACTOR" --password-stdin <<< "$GH_TOKEN"
          podman push --digestfile "$RUNNER_TEMP/digest" "$IMAGE:$TAG"
          digest=$(cat "$RUNNER_TEMP/digest")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$IMAGE:$TAG $digest"

      - name: Sign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          cosign login ghcr.io -u "$GH_ACTOR" --password-stdin <<< "$GH_TOKEN"
          cosign sign --yes --new-bundle-format=false --key env://COSIGN_PRIVATE_KEY "$IMAGE@$DIGEST"

      - name: Verify
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign verify --key "$PUBKEY" "$IMAGE@$DIGEST" > /dev/null

  disk:
    needs: image
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    env:
      DIGEST: ${{ needs.image.outputs.digest }}
      TAG: ${{ needs.image.outputs.tag }}
    steps:
      - uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman skopeo pigz dosfstools btrfs-progs

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.3

      - name: Pull
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cosign verify --key "$PUBKEY" "$IMAGE@$DIGEST" > /dev/null
          sudo podman login ghcr.io -u "$GH_ACTOR" --password-stdin <<< "$GH_TOKEN"
          sudo podman pull "$IMAGE@$DIGEST"
          sudo podman tag "$IMAGE@$DIGEST" "$IMAGE:$TAG"
          sudo podman pull "$BIB"

      - name: Disk
        run: |
          mkdir -p "$RUNNER_TEMP/bib"
          sudo podman run --rm --pull=never --privileged \
            --security-opt apparmor=unconfined \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$PWD/build/disk.toml:/config.toml:ro" \
            -v "$RUNNER_TEMP/bib:/output" \
            "$BIB" --type raw --rootfs btrfs --target-arch arm64 "$IMAGE:$TAG"
          mapfile -t raws < <(sudo find "$RUNNER_TEMP/bib" -name '*.raw')
          [[ ${#raws[@]} == 1 ]] || { echo "::error::expected one raw image, got ${raws[*]}"; exit 1; }
          echo "RAW=${raws[0]}" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP/microos-$TAG.img.gz" >> "$GITHUB_ENV"

      - name: Finalize
        run: sudo build/finalize-disk.sh "$RAW" "$IMAGE:$TAG"

      - name: Test
        run: sudo tests/disk.sh "$RAW" "$IMAGE:$TAG"

      - name: Compress
        run: |
          sudo chown "$(id -u):$(id -g)" "$RAW"
          pigz -c -p "$(nproc)" "$RAW" > "$OUT.part"
          mv -f "$OUT.part" "$OUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: microos-${{ needs.image.outputs.tag }}.img.gz
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
