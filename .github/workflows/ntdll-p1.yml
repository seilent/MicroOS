name: ntdll-p1

on:
  push:
    branches: [ntdll-p1]

permissions: {}

defaults:
  run:
    shell: bash

env:
  SDK: registry.gitlab.steamos.cloud/proton/steamrt4/sdk/arm64-llvm:4.0.20260331.220802-2@sha256:99db33ac7a587feb12e91150787b5e7ca5380d5506ae019574b44d3c7b611f7a
  PROTON_TAG: proton-11.0-2e
  PROTON_COMMIT: bc896217ffcd67f892f952b010f898fe7bd0f0a1
  WINE_COMMIT: e60892cc2398b0a83c332a2078c7b85e47bdb42b
  EPOCH: '1791559733'
  PATCH: packages/proton/patches/0001-ntdll-skip-getrusage-in-delay-execution.patch

jobs:
  ntdll:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: [control, p1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Pull SDK
        run: docker pull "$SDK"

      - name: Source
        run: |
          set -euxo pipefail
          sudo mkdir -p /builds/proton /builds/out
          sudo chown "$(id -u):$(id -g)" /builds/proton /builds/out
          git clone -q --filter=blob:none --no-checkout https://github.com/ValveSoftware/Proton.git /builds/proton/proton
          cd /builds/proton/proton
          git checkout -q "$PROTON_COMMIT"
          [[ $(git rev-parse "refs/tags/$PROTON_TAG^{commit}") == "$PROTON_COMMIT" ]]
          git submodule update -q --init --depth 1 wine
          [[ $(git -C wine rev-parse HEAD) == "$WINE_COMMIT" ]]
          if [[ ${{ matrix.variant }} == p1 ]]; then
            git -C wine apply --verbose "$GITHUB_WORKSPACE/$PATCH"
            cp "$GITHUB_WORKSPACE/$PATCH" /builds/out/
          fi
          git -C wine diff --stat
          mkdir build-dir
          {
            echo "proton $PROTON_TAG $PROTON_COMMIT"
            echo "wine $WINE_COMMIT"
            echo "sdk $SDK"
            echo "variant ${{ matrix.variant }}"
          } > /builds/out/source.txt

      - name: Build
        run: |
          docker run --rm -v /builds:/builds -w /builds/proton/proton/build-dir \
            -e EPOCH -e PROTON_TAG -e CCACHE_DISABLE=1 "$SDK" bash -euxo pipefail -c '
            cat > Makefile <<EOF
          SRCDIR     := ..
          BUILD_NAME := $PROTON_TAG
          TARGET_ARCH := arm64
          INTERNAL_TOOL_NAME := $PROTON_TAG
          ROOTLESS_CONTAINER := 1
          CONTAINER_ENGINE := docker

          include \$(SRCDIR)/Makefile.in
          EOF
            make -j"$(nproc)" CONTAINER=1 BASE_SOURCE_DATE_EPOCH="$EPOCH" WINE_DEPENDS= WINE_aarch64_DEPENDS= \
              wine-aarch64-configure "$PWD/.wine-wine-requests"
            SOURCE_DATE_EPOCH=$((EPOCH - 20)) make -C obj-wine-aarch64 -j"$(nproc)" dlls/ntdll/ntdll.so
            objcopy=objcopy
            if cc --version | grep -q clang; then objcopy=llvm-objcopy; fi
            cp obj-wine-aarch64/dlls/ntdll/ntdll.so /builds/out/ntdll.so.unstripped
            $objcopy --strip-debug --set-section-flags .text=contents,alloc,load,readonly,code \
              obj-wine-aarch64/dlls/ntdll/ntdll.so /builds/out/ntdll.so
            {
              cc --version | head -1
              head -8 obj-wine-aarch64/config.log
              grep -E "^(CC|CFLAGS|LDFLAGS|UNWINDLIBS|EXTRACFLAGS) " obj-wine-aarch64/Makefile
            } > /builds/out/build.txt
            llvm-objdump -d --no-show-raw-insn --disassemble-symbols=NtDelayExecution,NtYieldExecution \
              /builds/out/ntdll.so.unstripped > /builds/out/delay.dis
          ' 2>&1 | tee /builds/out/build.log | tail -60

      - name: Check
        run: |
          set -euxo pipefail
          cd /builds/out
          strings ntdll.so | grep -E '^wine-[0-9]' | tee strings.txt
          strings ntdll.so | grep -F /builds/proton/proton/build-dir/ | sort -u | tee -a strings.txt
          grep -c getrusage delay.dis || true
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS build.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ntdll-${{ matrix.variant }}
          path: /builds/out/
          if-no-files-found: error
