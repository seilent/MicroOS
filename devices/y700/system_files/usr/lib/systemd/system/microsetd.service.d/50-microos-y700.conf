[Unit]
Wants=sys-subsystem-backlight-devices-ktz8866\x2dbacklight.device
After=sys-subsystem-backlight-devices-ktz8866\x2dbacklight.device

[Service]
Environment=MICROSET_BACKLIGHT=/sys/class/backlight/ktz8866-backlight
Environment=MICROSET_ALSA_CARD=
Environment=MICROSET_RGB_DEVICE=
Environment=MICROSET_SCHEMA_DIR=/usr/share/microset/schema-y700.d
ReadWritePaths=-/sys/class/backlight/ktz8866-backlight/
SupplementaryGroups=video
DeviceAllow=
