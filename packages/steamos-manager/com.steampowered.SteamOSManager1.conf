<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="com.steampowered.SteamOSManager1"/>
    <allow send_destination="com.steampowered.SteamOSManager1"/>
  </policy>
  <policy group="wheel">
    <allow send_destination="com.steampowered.SteamOSManager1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="com.steampowered.SteamOSManager1" send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="com.steampowered.SteamOSManager1" send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="com.steampowered.SteamOSManager1" send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>
    <allow send_destination="com.steampowered.SteamOSManager1" send_interface="com.steampowered.SteamOSManager1.RootManager" send_member="ReloadConfig"/>
    <allow send_destination="com.steampowered.SteamOSManager1" send_interface="com.steampowered.SteamOSManager1.RootManager" send_member="SetWifiBackend"/>
    <allow send_destination="com.steampowered.SteamOSManager1" send_interface="com.steampowered.SteamOSManager1.RootManager" send_member="SetWifiPowerManagementState"/>
    <allow send_destination="com.steampowered.SteamOSManager1" send_interface="com.steampowered.SteamOSManager1.RootManager" send_member="UpdateBios"/>
    <allow send_destination="com.steampowered.SteamOSManager1" send_interface="com.steampowered.SteamOSManager1.Job1"/>
  </policy>
  <policy context="default">
    <deny send_destination="com.steampowered.SteamOSManager1"/>
  </policy>
</busconfig>
