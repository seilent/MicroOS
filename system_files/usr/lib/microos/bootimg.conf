MICROOS_BOOTIMG_FORMAT=2
MICROOS_BOOTIMG_ARGS="--header_version 0 --pagesize 2048 --base 0x10000000 --kernel_offset 0x00008000 --ramdisk_offset 0x06000000 --tags_offset 0x00000100 --os_version 12.0.0"
MICROOS_CMDLINE_MAX=511
MICROOS_DTB=qcom/sm8250-ayaneo-pocket-micro2.dtb

microos_cmdline() {
  local -
  set -f
  local LC_ALL=C
  local w v f ostree="" root="" boot="" subvol="" rf_at=-1 out
  local -a words=() flags=() parts=()
  local -A seen=() seenf=()
  for w in $1; do
    case $w in
      ostree=*)
        v=${w#ostree=}
        if [[ -n $ostree && $v != "$ostree" ]]; then
          echo "microos_cmdline: two different ostree= values" >&2
          return 1
        fi
        ostree=$v
        continue
        ;;
      microos.deploy=*|console=ttyS0)
        continue
        ;;
      rootflags=*)
        IFS=, read -ra parts <<< "${w#rootflags=}"
        for f in "${parts[@]}"; do
          if [[ $f == subvol=* ]]; then
            if [[ -n $subvol && ${f#subvol=} != "$subvol" ]]; then
              echo "microos_cmdline: two different rootflags subvol= values" >&2
              return 1
            fi
            subvol=${f#subvol=}
          fi
          if [[ -n $f && -z ${seenf[$f]:-} ]]; then
            seenf[$f]=1
            flags+=("$f")
          fi
        done
        if (( rf_at < 0 )); then
          rf_at=${#words[@]}
          words+=(rootflags=)
        fi
        continue
        ;;
      root=*)
        v=${w#root=}
        if [[ -n $root && $v != "$root" ]]; then
          echo "microos_cmdline: two different root= values" >&2
          return 1
        fi
        root=$v
        ;;
      boot=*)
        v=${w#boot=}
        if [[ -n $boot && $v != "$boot" ]]; then
          echo "microos_cmdline: two different boot= values" >&2
          return 1
        fi
        boot=$v
        ;;
    esac
    if [[ -z ${seen[$w]:-} ]]; then
      seen[$w]=1
      words+=("$w")
    fi
  done
  if [[ -z $ostree ]]; then
    echo "microos_cmdline: no ostree= in the options" >&2
    return 1
  fi
  if [[ -z ${2:-} ]]; then
    echo "microos_cmdline: no deploy id" >&2
    return 1
  fi
  if (( rf_at >= 0 )); then
    if (( ${#flags[@]} )); then
      words[rf_at]=rootflags=$(IFS=,; echo "${flags[*]}")
    else
      unset 'words[rf_at]'
    fi
  fi
  out="ostree=$ostree"
  for w in "${words[@]}"; do
    out+=" $w"
  done
  out+=" microos.deploy=$2"
  if (( ${#out} > MICROOS_CMDLINE_MAX )); then
    echo "microos_cmdline: cmdline is ${#out} bytes, the limit is $MICROOS_CMDLINE_MAX" >&2
    return 1
  fi
  printf '%s\n' "$out"
}

microos_bootimg_id() {
  local f
  for f in "$2" "$3" "$4"; do
    if [[ ! -f $f || ! -r $f ]]; then
      echo "microos_bootimg_id: cannot read $f" >&2
      return 1
    fi
  done
  {
    printf '%s\n' "$MICROOS_BOOTIMG_FORMAT" "$MICROOS_BOOTIMG_ARGS" "$5" "$1"
    sha256sum < "$2"
    sha256sum < "$3"
    sha256sum < "$4"
  } | sha256sum | cut -d' ' -f1
}
