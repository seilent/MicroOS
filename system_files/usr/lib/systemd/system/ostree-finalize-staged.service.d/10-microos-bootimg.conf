[Unit]
RequiresMountsFor=/boot/efi /var/lib/microos

[Service]
ExecStartPre=/usr/libexec/microos/microos-bootimg-update --check
ExecStop=
ExecStop=/usr/libexec/microos/microos-bootlog run finalize-staged -- /usr/bin/ostree admin finalize-staged
ExecStop=-/usr/libexec/microos/microos-bootlog run finalize -- /usr/libexec/microos/microos-bootimg-update
