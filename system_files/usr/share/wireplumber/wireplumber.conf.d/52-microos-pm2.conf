monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*"
        alsa.card_name = "PocketMICRO2"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output.*Headphones.*"
        alsa.card_name = "PocketMICRO2"
      }
    ]
    actions = {
      update-props = {
        priority.session = 1100
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output.*Speaker.*"
        alsa.card_name = "PocketMICRO2"
      }
    ]
    actions = {
      update-props = {
        priority.session = 1000
      }
    }
  }
]
